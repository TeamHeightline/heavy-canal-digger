[entity-description]
heavy-canal-digger=Наземный каналокопатель. В рабочем режиме превращает грунт под головкой в широкий водяной канал. Для непрерывного рытья отступайте задним ходом по суше; по воде машина не ездит. Земля поступает в багажник. Открывается вместе с железной дорогой.
